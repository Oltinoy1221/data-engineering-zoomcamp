[project]
name = "data-engineering-zoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oltinoy Toshmuradova", email = "78873508+Oltinoy1221@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.4",
    "tqdm>=4.70.1",
]

[project.scripts]
data-engineering-zoomcamp = "data_engineering_zoomcamp:main"

[build-system]
